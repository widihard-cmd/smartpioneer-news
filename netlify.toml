# netlify.toml
# ──────────────────────────────────────────────────────────────
# SmartPioneer — Netlify Deployment Configuration
# ──────────────────────────────────────────────────────────────

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS    = "--legacy-peer-deps"

# ── Dev server ─────────────────────────────────────────────────
[dev]
  command = "npm run dev"
  port    = 4321

# ── Headers: security + cache ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control  = "public, max-age=86400"
    Accept-Ranges  = "bytes"

# ── Redirects ──────────────────────────────────────────────────
[[redirects]]
  from   = "/berita"
  to     = "/news"
  status = 301

[[redirects]]
  from   = "/api/pi-market"
  to     = "/.netlify/functions/pi-market"
  status = 200

[[redirects]]
  from   = "/api/pi-payment-config"
  to     = "/.netlify/functions/pi-payment-config"
  status = 200

[[redirects]]
  from   = "/api/pi-payment-approve"
  to     = "/.netlify/functions/pi-payment-approve"
  status = 200

[[redirects]]
  from   = "/api/pi-payment-complete"
  to     = "/.netlify/functions/pi-payment-complete"
  status = 200

[[redirects]]
  from   = "/marketplace"
  to     = "/"
  status = 302

# ── Netlify Functions (webhook endpoint) ───────────────────────
# POST /api/revalidate → memicu rebuild dari webhook eksternal
# (Contentful webhook, Zapier, Make, dll.)
[functions]
  directory = "netlify/functions"

